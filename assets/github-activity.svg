<svg
  width="860"
  height="300"
  viewBox="0 0 860 300"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <style>
    .text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 14px;
      fill: #c9d1d9;
    }

    .label {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 14px;
      font-weight: 700;
      fill: #58a6ff;
    }

    .username {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 15px;
      font-weight: 700;
      fill: #58a6ff;
    }

    .muted {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 12px;
      fill: #8b949e;
    }
  </style>

  <!-- Card -->
  <rect
    x="1"
    y="1"
    width="858"
    height="298"
    rx="12"
    fill="#0d1117"
    stroke="#30363d"
  />

  <!-- Terminal Header -->
  <rect
    x="1"
    y="1"
    width="858"
    height="34"
    rx="12"
    fill="#161b22"
  />

  <rect
    x="1"
    y="24"
    width="858"
    height="11"
    fill="#161b22"
  />

  <!-- Window Buttons -->
  <circle cx="22" cy="18" r="6" fill="#ff5f56" />
  <circle cx="42" cy="18" r="6" fill="#ffbd2e" />
  <circle cx="62" cy="18" r="6" fill="#27c93f" />

  <!-- Terminal Title -->
  <text x="430" y="22" text-anchor="middle" class="muted">
    khosoongyang@github: ~ $ neofetch
  </text>

  <!-- ASCII Logo -->
  <text x="45" y="86" class="label">╭────────╮</text>
  <text x="45" y="106" class="label">│ ██ ██  │</text>
  <text x="45" y="126" class="label">│ ·github│</text>
  <text x="45" y="146" class="label">│ &gt; _   │</text>
  <text x="45" y="166" class="label">╰────────╯</text>

  <!-- Username -->
  <text x="260" y="72" class="username">
    khosoongyang
  </text>

  <text x="380" y="72" class="muted">
    @github
  </text>

  <line
    x1="260"
    y1="84"
    x2="520"
    y2="84"
    stroke="#30363d"
  />

  <!-- Profile information -->
  <text x="260" y="112" class="label">Name</text>
  <text x="370" y="112" class="text">khosoongyang</text>

  <text x="260" y="138" class="label">Role</text>
  <text x="370" y="138" class="text">Cybersecurity Student</text>

  <text x="260" y="164" class="label">Stars</text>
  <text x="370" y="164" class="text">4</text>

  <text x="260" y="190" class="label">Repos</text>
  <text x="370" y="190" class="text">7</text>

  <text x="260" y="216" class="label">Followers</text>
  <text x="370" y="216" class="text">6</text>

  <text x="260" y="242" class="label">Focus</text>
  <text x="370" y="242" class="text">
    Cybersecurity · AI · Automation
  </text>

  <!-- Colour blocks -->
  <rect x="260" y="263" width="22" height="14" rx="2" fill="#58a6ff"/>
  <rect x="288" y="263" width="22" height="14" rx="2" fill="#3fb950"/>
  <rect x="316" y="263" width="22" height="14" rx="2" fill="#a371f7"/>
  <rect x="344" y="263" width="22" height="14" rx="2" fill="#39c5cf"/>
  <rect x="372" y="263" width="22" height="14" rx="2" fill="#1f6feb"/>
  <rect x="400" y="263" width="22" height="14" rx="2" fill="#7ee787"/>
</svg>
